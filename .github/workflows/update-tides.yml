name: Update Noosa tide predictions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and parse official predictions
        run: python scripts/update_tides.py
      - name: Commit updated tide data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noosa-tides-2026.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Noosa Head tide predictions"
            git push
          fi
